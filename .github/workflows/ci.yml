name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format --dry-run --Werror *.c

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r) bc
      - name: Build module
        run: make
      - name: Run tests
        run: sudo bash tests/run_tests.sh